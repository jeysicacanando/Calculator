<!DOCTYPE html>
<meta charset="UTF-8">
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px;
  }
  #calc {
    width: 320px;
    background: #222;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  #screen {
    color: white;
    text-align: right;
    padding: 10px 5px 20px;
    overflow: hidden;
  }
  #expr { color: #999; font-size: 18px; height: 22px; }
  #display { font-size: 48px; font-weight: bold; }
  #keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    font-size: 22px;
    padding: 18px 0;
    border: none;
    border-radius: 12px;
    background: #444;
    color: white;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.2); }
  button:active { transform: scale(0.95); }
  .op { background: #4a7cff; }
  .fn { background: #666; }
  .eq { background: #ff9500; }
  .sci { background: #555; font-size: 18px; padding: 14px 0; }

  #history-box {
    margin-top: 20px;
    border-top: 1px solid #444;
    padding-top: 12px;
    color: #ccc;
  }
  #history-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #clear-hist {
    font-size: 12px;
    padding: 6px 10px;
    background: #444;
  }
  #history {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
    max-height: 180px;
    overflow-y: auto;
  }
  #history li {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 6px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }
  #history li:hover { background: #333; }
  #history .res { color: white; font-weight: bold; }
  #history .empty { color: #777; cursor: default; justify-content: center; }
  #history .empty:hover { background: none; }
</style>

<div id="calc">
  <div id="screen">
    <div id="expr"></div>
    <div id="display">0</div>
  </div>
  <div id="keys">
    <button class="sci" data-k="sqrt">√</button>
    <button class="sci" data-k="sq">x²</button>
    <button class="sci" data-k="inv">1/x</button>
    <button class="sci" data-k="log">log</button>

    <button class="sci" data-k="ln">ln</button>
    <button class="sci" data-k="sin">sin</button>
    <button class="sci" data-k="cos">cos</button>
    <button class="sci" data-k="tan">tan</button>

    <button class="fn" data-k="C">C</button>
    <button class="fn" data-k="±">±</button>
    <button class="op" data-k="%">%</button>
    <button class="op" data-k="/">÷</button>

    <button data-k="7">7</button>
    <button data-k="8">8</button>
    <button data-k="9">9</button>
    <button class="op" data-k="*">×</button>

    <button data-k="4">4</button>
    <button data-k="5">5</button>
    <button data-k="6">6</button>
    <button class="op" data-k="-">−</button>

    <button data-k="1">1</button>
    <button data-k="2">2</button>
    <button data-k="3">3</button>
    <button class="op" data-k="+">+</button>

    <button data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="op" data-k="**">^</button>
    <button class="eq" data-k="=">=</button>
  </div>

  <div id="history-box">
    <div id="history-head">
      <span>History</span>
      <button id="clear-hist">Clear</button>
    </div>
    <ul id="history"></ul>
  </div>
</div>

<script>
const UNARY = ["sqrt", "sq", "inv", "log", "ln", "sin", "cos", "tan"];
const SYMBOLS = { "*": "×", "/": "÷", "-": "−", "**": "^" };
let current = "0", first = null, op = null, fresh = false;
const display = document.getElementById("display");
const expr = document.getElementById("expr");
const historyList = document.getElementById("history");

// ---------- History ----------
let history = [];
try {
  history = JSON.parse(localStorage.getItem("calcHistory")) || [];
} catch (e) {
  history = [];
}

function saveHistory() {
  try { localStorage.setItem("calcHistory", JSON.stringify(history)); } catch (e) {}
}

function renderHistory() {
  historyList.innerHTML = "";
  if (history.length === 0) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "No calculations yet";
    historyList.appendChild(li);
    return;
  }
  history.forEach(item => {
    const li = document.createElement("li");
    const left = document.createElement("span");
    left.textContent = item.text + " =";
    const right = document.createElement("span");
    right.className = "res";
    right.textContent = item.result;
    li.append(left, right);
    li.addEventListener("click", () => {
      current = item.result;
      first = null; op = null; fresh = true;
      expr.textContent = item.text + " =";
      display.textContent = current;
    });
    historyList.appendChild(li);
  });
}

function addHistory(text, result) {
  history.unshift({ text, result });
  if (history.length > 10) history.pop();
  saveHistory();
  renderHistory();
}

document.getElementById("clear-hist").addEventListener("click", () => {
  history = [];
  saveHistory();
  renderHistory();
});

renderHistory();

// ---------- Calculator ----------
async function compute() {
  const q = `a=${encodeURIComponent(first)}&op=${encodeURIComponent(op)}&b=${encodeURIComponent(current)}`;
  const data = await (await fetch("/calc?" + q)).json();
  if (data.error) throw new Error(data.error);
  return data.result.replace(/\.0$/, "");
}

async function press(k) {
  try {
    if (/^\d$/.test(k)) {
      current = (fresh || current === "0") ? k : current + k;
      fresh = false;
    } else if (k === ".") {
      if (fresh) { current = "0."; fresh = false; }
      else if (!current.includes(".")) current += ".";
    } else if (k === "C") {
      current = "0"; first = null; op = null; fresh = false;
      expr.textContent = "";
    } else if (k === "⌫") {
      if (!fresh) {
        current = current.slice(0, -1);
        if (current === "" || current === "-") current = "0";
      }
    } else if (k === "±") {
      if (current !== "0") {
        current = current.startsWith("-") ? current.slice(1) : "-" + current;
      }
    } else if (k === "=") {
      if (op === null || fresh) return;
      const result = await compute();
      const text = `${first} ${SYMBOLS[op] || op} ${current}`;
      expr.textContent = text + " =";
      addHistory(text, result);
      current = result; first = null; op = null; fresh = true;
    } else if (UNARY.includes(k)) {
      const q = `a=${encodeURIComponent(current)}&op=${k}&b=0`;
      const data = await (await fetch("/calc?" + q)).json();
      if (data.error) throw new Error(data.error);
      const result = data.result.replace(/\.0$/, "");
      const text = `${k}(${current})`;
      expr.textContent = text + " =";
      addHistory(text, result);
      current = result;
      fresh = true;
    } else {
      if (op !== null && !fresh) { first = await compute(); current = first; }
      else first = current;
      op = k; fresh = true;
      expr.textContent = `${first} ${SYMBOLS[op] || op}`;
    }
  } catch (e) {
    current = "0"; first = null; op = null; fresh = false;
    expr.textContent = e.message;
  }
  display.textContent = current;
}

document.getElementById("keys").addEventListener("click", e => {
  if (e.target.dataset.k) press(e.target.dataset.k);
});

document.addEventListener("keydown", e => {
  if (/^[\d.+\-*/%]$/.test(e.key)) press(e.key);
  else if (e.key === "Enter") { e.preventDefault(); press("="); }
  else if (e.key === "Backspace") press("⌫");
  else if (e.key === "Escape") press("C");
});
</script>
