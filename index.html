<!DOCTYPE html>
<meta charset="UTF-8">
<style>
  /* Light theme (default) */
  :root {
    --page-bg: #f0f2f5;
    --calc-bg: #ffffff;
    --text: #222;
    --muted: #777;
    --btn-bg: #e4e6eb;
    --btn-text: #222;
    --fn-bg: #cfd3da;
    --sci-bg: #d8dbe1;
    --op-bg: #4a7cff;
    --eq-bg: #ff9500;
    --border: #ddd;
    --hover-bg: #f0f2f5;
    --shadow: rgba(0,0,0,0.15);
  }
  /* Dark theme: same names, different values */
  :root[data-theme="dark"] {
    --page-bg: #121212;
    --calc-bg: #222;
    --text: #fff;
    --muted: #999;
    --btn-bg: #444;
    --btn-text: #fff;
    --fn-bg: #666;
    --sci-bg: #555;
    --border: #444;
    --hover-bg: #333;
    --shadow: rgba(0,0,0,0.6);
  }

  body {
    font-family: Arial, sans-serif;
    background: var(--page-bg);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px;
    transition: background 0.3s;
  }
  #calc {
    width: 320px;
    background: var(--calc-bg);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 30px var(--shadow);
    transition: background 0.3s;
  }
  #top { display: flex; justify-content: flex-end; }
  #theme {
    font-size: 18px;
    padding: 6px 10px;
    background: var(--btn-bg);
  }
  #screen {
    color: var(--text);
    text-align: right;
    padding: 10px 5px 20px;
    overflow: hidden;
  }
  #expr { color: var(--muted); font-size: 18px; height: 22px; }
  #display { font-size: 48px; font-weight: bold; }
  #keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    font-size: 22px;
    padding: 18px 0;
    border: none;
    border-radius: 12px;
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
  button:active { transform: scale(0.95); }
  .op { background: var(--op-bg); color: white; }
  .fn { background: var(--fn-bg); }
  .eq { background: var(--eq-bg); color: white; }
  .sci { background: var(--sci-bg); font-size: 18px; padding: 14px 0; }

  #history-box {
    margin-top: 20px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
    color: var(--muted);
  }
  #history-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #clear-hist {
    font-size: 12px;
    padding: 6px 10px;
  }
  #history {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
    max-height: 180px;
    overflow-y: auto;
  }
  #history li {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 6px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }
  #history li:hover { background: var(--hover-bg); }
  #history .res { color: var(--text); font-weight: bold; }
  #history .empty { cursor: default; justify-content: center; }
  #history .empty:hover { background: none; }
</style>

<div id="calc">
  <div id="top">
    <button id="theme" title="Toggle theme">🌙</button>
  </div>
  <div id="screen">
    <div id="expr"></div>
    <div id="display">0</div>
  </div>
  <div id="keys">
    <button class="sci" data-k="sqrt">√</button>
    <button class="sci" data-k="sq">x²</button>
    <button class="sci" data-k="inv">1/x</button>
    <button class="sci" data-k="log">log</button>

    <button class="sci" data-k="ln">ln</button>
    <button class="sci" data-k="sin">sin</button>
    <button class="sci" data-k="cos">cos</button>
    <button class="sci" data-k="tan">tan</button>

    <button class="fn" data-k="C">C</button>
    <button class="fn" data-k="±">±</button>
    <button class="op" data-k="%">%</button>
    <button class="op" data-k="/">÷</button>

    <button data-k="7">7</button>
    <button data-k="8">8</button>
    <button data-k="9">9</button>
    <button class="op" data-k="*">×</button>

    <button data-k="4">4</button>
    <button data-k="5">5</button>
    <button data-k="6">6</button>
    <button class="op" data-k="-">−</button>

    <button data-k="1">1</button>
    <button data-k="2">2</button>
    <button data-k="3">3</button>
    <button class="op" data-k="+">+</button>

    <button data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="op" data-k="**">^</button>
    <button class="eq" data-k="=">=</button>
  </div>

  <div id="history-box">
    <div id="history-head">
      <span>History</span>
      <button id="clear-hist">Clear</button>
    </div>
    <ul id="history"></ul>
  </div>
</div>

<script>
const UNARY = ["sqrt", "sq", "inv", "log", "ln", "sin", "cos", "tan"];
const SYMBOLS = { "*": "×", "/": "÷", "-": "−", "**": "^" };
let current = "0", first = null, op = null, fresh = false;
const display = document.getElementById("display");
const expr = document.getElementById("expr");
const historyList = document.getElementById("history");

// ---------- Theme ----------
const root = document.documentElement;
const themeBtn = document.getElementById("theme");

function setTheme(t) {
  root.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
  try { localStorage.setItem("theme", t); } catch (e) {}
}

let savedTheme = null;
try { savedTheme = localStorage.getItem("theme"); } catch (e) {}
setTheme(savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

themeBtn.addEventListener("click", () => {
  setTheme(root.dataset.theme === "dark" ? "light" : "dark");
  themeBtn.blur(); // so pressing Enter later doesn't re-click this button
});

// ---------- History ----------
let history = [];
try {
  history = JSON.parse(localStorage.getItem("calcHistory")) || [];
} catch (e) {
  history = [];
}

function saveHistory() {
  try { localStorage.setItem("calcHistory", JSON.stringify(history)); } catch (e) {}
}

function renderHistory() {
  historyList.innerHTML = "";
  if (history.length === 0) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "No calculations yet";
    historyList.appendChild(li);
    return;
  }
  history.forEach(item => {
    const li = document.createElement("li");
    const left = document.createElement("span");
    left.textContent = item.text + " =";
    const right = document.createElement("span");
    right.className = "res";
    right.textContent = item.result;
    li.append(left, right);
    li.addEventListener("click", () => {
      current = item.result;
      first = null; op = null; fresh = true;
      expr.textContent = item.text + " =";
      display.textContent = current;
    });
    historyList.appendChild(li);
  });
}

function addHistory(text, result) {
  history.unshift({ text, result });
  if (history.length > 10) history.pop();
  saveHistory();
  renderHistory();
}

document.getElementById("clear-hist").addEventListener("click", () => {
  history = [];
  saveHistory();
  renderHistory();
});

renderHistory();

// ---------- Calculator ----------
async function compute() {
  const q = `a=${encodeURIComponent(first)}&op=${encodeURIComponent(op)}&b=${encodeURIComponent(current)}`;
  const data = await (await fetch("/calc?" + q)).json();
  if (data.error) throw new Error(data.error);
  return data.result.replace(/\.0$/, "");
}

async function press(k) {
  try {
    if (/^\d$/.test(k)) {
      current = (fresh || current === "0") ? k : current + k;
      fresh = false;
    } else if (k === ".") {
      if (fresh) { current = "0."; fresh = false; }
      else if (!current.includes(".")) current += ".";
    } else if (k === "C") {
      current = "0"; first = null; op = null; fresh = false;
      expr.textContent = "";
    } else if (k === "⌫") {
      if (!fresh) {
        current = current.slice(0, -1);
        if (current === "" || current === "-") current = "0";
      }
    } else if (k === "±") {
      if (current !== "0") {
        current = current.startsWith("-") ? current.slice(1) : "-" + current;
      }
    } else if (k === "=") {
      if (op === null || fresh) return;
      const result = await compute();
      const text = `${first} ${SYMBOLS[op] || op} ${current}`;
      expr.textContent = text + " =";
      addHistory(text, result);
      current = result; first = null; op = null; fresh = true;
    } else if (UNARY.includes(k)) {
      const q = `a=${encodeURIComponent(current)}&op=${k}&b=0`;
      const data = await (await fetch("/calc?" + q)).json();
      if (data.error) throw new Error(data.error);
      const result = data.result.replace(/\.0$/, "");
      const text = `${k}(${current})`;
      expr.textContent = text + " =";
      addHistory(text, result);
      current = result;
      fresh = true;
    } else {
      if (op !== null && !fresh) { first = await compute(); current = first; }
      else first = current;
      op = k; fresh = true;
      expr.textContent = `${first} ${SYMBOLS[op] || op}`;
    }
  } catch (e) {
    current = "0"; first = null; op = null; fresh = false;
    expr.textContent = e.message;
  }
  display.textContent = current;
}

document.getElementById("keys").addEventListener("click", e => {
  if (e.target.dataset.k) press(e.target.dataset.k);
});

document.addEventListener("keydown", e => {
  if (/^[\d.+\-*/%]$/.test(e.key)) press(e.key);
  else if (e.key === "Enter") { e.preventDefault(); press("="); }
  else if (e.key === "Backspace") press("⌫");
  else if (e.key === "Escape") press("C");
});
</script>
