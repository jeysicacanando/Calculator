<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
  }
  h1 { color: #333; }
  input, select, button {
    font-size: 20px;
    padding: 10px;
    margin: 5px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  input { width: 100px; }
  button {
    background: #4a7cff;
    color: white;
    border: none;
    cursor: pointer;
  }
  button:hover { background: #3a63cc; }
  #out {
    font-size: 32px;
    font-weight: bold;
    color: #222;
  }
  #history {
    list-style: none;
    padding: 0;
    color: #555;
    font-size: 18px;
  }
</style>

<h1>Calculator</h1>
<div>
  <input id="a" type="number">
  <select id="op">
    <option>+</option><option>-</option><option>*</option><option>/</option><option>%</option><option>**</option>
  </select>
  <input id="b" type="number">
  <button onclick="calc()">=</button>
</div>
<p id="out"></p>
<ul id="history"></ul>

<script>
const calcHistory = [];

async function calc() {
  const a = document.getElementById("a").value;
  const op = document.getElementById("op").value;
  const b = document.getElementById("b").value;
  const q = `a=${encodeURIComponent(a)}&op=${encodeURIComponent(op)}&b=${encodeURIComponent(b)}`;
  const data = await (await fetch("/calc?" + q)).json();
  document.getElementById("out").textContent = data.result ?? data.error;

  if (data.result) {
    calcHistory.unshift(`${a} ${op} ${b} = ${data.result}`);
    if (calcHistory.length > 5) calcHistory.pop();
    document.getElementById("history").innerHTML =
      calcHistory.map(h => `<li>${h}</li>`).join("");
  }
}

document.addEventListener("keydown", e => { if (e.key === "Enter") calc(); });
</script>
